<style>
/* Layout: one phone-width column, content scrolls, fixed bottom tab bar. Chalk-grey ground, ink text, cobalt accent, amber only for personal records. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#E3E8ED; --ink:#131A22; --muted:#5B6775; --line:#D3DAE1;
  --accent:#2B59FF; --accent-ink:#FFFFFF; --accent-soft:#DCE4FF; --pr:#B86E00; --pr-soft:#FFEBC7; --good:#17804A; --bad:#C23B33;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#17202A; --surface2:#1F2A36; --ink:#E8EEF4; --muted:#93A0AF; --line:#2A3644;
  --accent:#7C9CFF; --accent-ink:#0E141B; --accent-soft:#1D2B52; --pr:#FFB020; --pr-soft:#3A2C0C; --good:#3CCB85; --bad:#FF7A70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#17202A; --surface2:#1F2A36; --ink:#E8EEF4; --muted:#93A0AF; --line:#2A3644;
  --accent:#7C9CFF; --accent-ink:#0E141B; --accent-soft:#1D2B52; --pr:#FFB020; --pr-soft:#3A2C0C; --good:#3CCB85; --bad:#FF7A70; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-inline:16px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-block:12px 96px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1.05}
h2{font-size:24px;line-height:1.1}
h3{font-size:19px;line-height:1.15}
p{margin:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;color:var(--muted);font-weight:500;margin-left:2px}
.stat .l{font-size:12px;color:var(--muted);letter-spacing:.04em}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.chip.pr{background:var(--pr-soft);color:var(--pr)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.multi button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px;z-index:5}
.tabs button{flex:1 1 0;max-width:120px;appearance:none;border:0;background:transparent;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;min-height:48px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.list{display:flex;flex-direction:column}
.list>.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.list>.item:first-child{border-top:0}
.item .t{font-weight:600;min-width:0}
.item .s{font-size:13px;color:var(--muted)}
.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center;padding:4px 0}
.setrow .idx{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.setrow input{background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:8px;min-height:44px;width:100%;min-width:0;text-align:center;font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.setrow.done input{background:var(--accent-soft);color:var(--accent)}
.setrow .ck{appearance:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.setrow.done .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setrow .ck svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.colhead{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rest{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:6}
.rest .num{font-size:28px}
.rest .btn{background:transparent;color:var(--bg);border-color:currentColor}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .bx{fill:var(--accent)}
.chart .bx.dim{opacity:.4}
.chart .dot.pr{fill:var(--pr)}
.chart .lbl{fill:var(--ink);font-weight:600}
.banner{background:var(--pr-soft);color:var(--pr);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{appearance:none;background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font-weight:600;cursor:pointer}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.mini{display:flex;gap:4px}
.mini i{width:10px;height:10px;border-radius:3px;background:var(--surface2)}
.mini i.on{background:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.week b{display:grid;place-items:center;height:34px;border-radius:9px;background:var(--surface2);color:var(--ink);font-family:var(--display);font-size:16px;font-weight:600}
.week b.on{background:var(--accent);color:var(--accent-ink)}
.week b.today{outline:2px solid var(--accent);outline-offset:1px}
.sheet-x{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:36px;padding:0 4px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:background .15s,border-color .15s}}
</style>
<style>
.how{background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.how ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.how a{color:var(--accent);font-weight:600;min-height:28px;display:inline-flex;align-items:center}
.foodform{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
</style>
<style>
.chip.good{background:var(--surface2);color:var(--good)}
.chip.bad{background:var(--surface2);color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart .bx.out{fill:var(--muted);opacity:.55}
.chart .tgt{stroke:var(--pr);stroke-width:1.5;stroke-dasharray:4 4}
.mealhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.mealhead:first-child{border-top:0;padding-top:0}
</style>
<style>
.qsel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:36px;font-weight:600}
</style>
<style>
.week .wkd{appearance:none;border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:stretch;min-width:0}
.week .wkd:disabled{opacity:.4;cursor:default}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qin{background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:6px;min-height:44px;width:72px;text-align:center;font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.dayrow{appearance:none;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:11px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;cursor:pointer;min-height:44px;color:inherit;font:inherit}
.dayrow:first-child{border-top:0}
.dayrow .t{font-weight:600;min-width:0}
.dayrow .s{font-size:13px;font-weight:400;color:var(--muted)}
.dayrow .chev{color:var(--muted);font-size:22px;line-height:1}
.setrow .ck.x{font-size:22px;color:var(--muted)}
</style>
</head>
<body>
<script>window.__PWA = true;</script>

<div class="app" id="app"></div>
<div id="restHost"></div>
<nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>
<script>
/* ---------- Exercise library ---------- */
// id: [name, muscle, equipment, compound?, share of bodyweight for a working set, increment kg]
const LIB = {
  bench:['Barbell Bench Press','Chest','barbell',1,.6,2.5], dbbench:['Dumbbell Bench Press','Chest','dumbbell',1,.22,2], incdb:['Incline Dumbbell Press','Chest','dumbbell',1,.18,2],
  chestpress:['Machine Chest Press','Chest','machine',1,.6,2.5], pushup:['Push-Up','Chest','bodyweight',1,0,0], cablefly:['Cable Fly','Chest','cable',0,.15,2.5], dbfly:['Dumbbell Fly','Chest','dumbbell',0,.1,1],
  row:['Barbell Row','Back','barbell',1,.55,2.5], dbrow:['One-Arm Dumbbell Row','Back','dumbbell',1,.25,2], pulldown:['Lat Pulldown','Back','machine',1,.6,2.5],
  pullup:['Pull-Up','Back','bodyweight',1,0,0], cablerow:['Seated Cable Row','Back','cable',1,.55,2.5], invrow:['Inverted Row','Back','bodyweight',1,0,0],
  ohp:['Overhead Press','Shoulders','barbell',1,.38,2.5], dbohp:['Dumbbell Shoulder Press','Shoulders','dumbbell',1,.16,2], pike:['Pike Push-Up','Shoulders','bodyweight',1,0,0],
  lateral:['Lateral Raise','Shoulders','dumbbell',0,.06,1], rear:['Rear Delt Fly','Shoulders','dumbbell',0,.05,1], facepull:['Face Pull','Shoulders','cable',0,.2,2.5],
  curl:['Barbell Curl','Biceps','barbell',0,.28,2.5], dbcurl:['Dumbbell Curl','Biceps','dumbbell',0,.12,1], hammer:['Hammer Curl','Biceps','dumbbell',0,.12,1], cablecurl:['Cable Curl','Biceps','cable',0,.25,2.5],
  pushdown:['Triceps Pushdown','Triceps','cable',0,.3,2.5], skull:['Skull Crusher','Triceps','barbell',0,.25,2.5], dbext:['Overhead Triceps Extension','Triceps','dumbbell',0,.15,2],
  closegrip:['Close-Grip Push-Up','Triceps','bodyweight',0,0,0], bdip:['Bench Dip','Triceps','bodyweight',0,0,0],
  declinepush:['Feet-Elevated Push-Up','Chest','bodyweight',1,0,0], ytraise:['Prone Y Raise','Shoulders','bodyweight',0,0,0], chinup:['Chin-Up','Biceps','bodyweight',1,0,0],
  splitsquat:['Split Squat','Quads','bodyweight',1,0,0], singlebridge:['Single-Leg Glute Bridge','Glutes','bodyweight',0,0,0],
  squat:['Back Squat','Quads','barbell',1,.8,2.5], goblet:['Goblet Squat','Quads','dumbbell',1,.3,2], legpress:['Leg Press','Quads','machine',1,1.5,5], legext:['Leg Extension','Quads','machine',0,.45,2.5],
  lunge:['Walking Lunge','Quads','dumbbell',1,.18,2], bsplit:['Bulgarian Split Squat','Quads','dumbbell',1,.2,2], bwsquat:['Bodyweight Squat','Quads','bodyweight',1,0,0],
  rdl:['Romanian Deadlift','Hamstrings','barbell',1,.8,2.5], dbrdl:['Dumbbell Romanian Deadlift','Hamstrings','dumbbell',1,.3,2], legcurl:['Leg Curl','Hamstrings','machine',0,.4,2.5],
  hipthrust:['Hip Thrust','Glutes','barbell',1,.9,5], glutebridge:['Glute Bridge','Glutes','bodyweight',0,0,0], deadlift:['Deadlift','Hamstrings','barbell',1,1,2.5],
  calf:['Standing Calf Raise','Calves','machine',0,1,5], dbcalf:['Single-Leg Calf Raise','Calves','bodyweight',0,0,0],
  crunch:['Cable Crunch','Core','cable',0,.4,2.5], legraise:['Hanging Leg Raise','Core','bodyweight',0,0,0], deadbug:['Dead Bug','Core','bodyweight',0,0,0]
};
const nm = id => (LIB[id] ? LIB[id][0] : id);
const muscleOf = id => (LIB[id] ? LIB[id][1] : 'Other');
const isBW = id => !LIB[id] || LIB[id][5] === 0;
const MUSCLES = ['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Core'];

const POOLS = {
  hpush:['bench','chestpress','dbbench','pushup'], ipush:['incdb','chestpress','dbbench','declinepush','pushup'], fly:['cablefly','dbfly'],
  vpush:['ohp','dbohp','pike'], vpull:['pulldown','pullup','dbrow','invrow'], hpull:['row','cablerow','dbrow','invrow'],
  lateral:['lateral'], rear:['facepull','rear','ytraise'], bi:['curl','cablecurl','dbcurl','hammer','chinup'], bi2:['hammer','dbcurl','cablecurl','chinup'],
  tri:['pushdown','skull','dbext','closegrip','bdip'], quad:['squat','legpress','goblet','bsplit','bwsquat','splitsquat'], quad2:['legpress','bsplit','lunge','legext','bwsquat','splitsquat'],
  ham:['rdl','dbrdl','legcurl','glutebridge','singlebridge'], glute:['hipthrust','glutebridge','dbrdl','singlebridge'], dl:['deadlift','rdl','dbrdl','glutebridge'],
  calf:['calf','dbcalf'], core:['crunch','legraise','deadbug']
};
const DAYS = {
  'Full Body A':['hpush','quad','hpull','vpush','ham','core'], 'Full Body B':['quad2','vpull','ipush','dl','bi','tri'], 'Full Body C':['quad','hpush','hpull','lateral','glute','core'],
  'Upper':['hpush','hpull','vpush','vpull','lateral','bi','tri'], 'Lower':['quad','ham','quad2','glute','calf','core'],
  'Push':['hpush','vpush','ipush','lateral','fly','tri'], 'Pull':['vpull','hpull','rear','bi','bi2','core'], 'Legs':['quad','ham','quad2','glute','calf','core']
};
const SPLITS = {
  2:['Full Body A','Full Body B'], 3:['Full Body A','Full Body B','Full Body C'], 4:['Upper','Lower','Upper','Lower'],
  5:['Push','Pull','Legs','Upper','Lower'], 6:['Push','Pull','Legs','Push','Pull','Legs']
};
const SCHEME = {
  muscle:{c:{s:3,lo:6,hi:10,rest:120}, i:{s:3,lo:10,hi:15,rest:75}},
  strength:{c:{s:4,lo:3,hi:6,rest:180}, i:{s:3,lo:8,hi:12,rest:90}},
  fatloss:{c:{s:3,lo:8,hi:12,rest:75}, i:{s:3,lo:12,hi:15,rest:45}},
  general:{c:{s:3,lo:8,hi:12,rest:90}, i:{s:3,lo:10,hi:15,rest:60}}
};
const GOALS = {muscle:'Build muscle', strength:'Get stronger', fatloss:'Lose fat', general:'General fitness'};
const EXPS = {beginner:'Beginner', intermediate:'Intermediate', advanced:'Advanced'};
const EQUIPS = {gym:'Full gym', dumbbells:'Dumbbells', bodyweight:'Bodyweight'};

function allowed(id, equip){
  const e = LIB[id][2];
  if (equip === 'gym') return true;
  if (equip === 'dumbbells') return e === 'dumbbell' || e === 'bodyweight';
  return e === 'bodyweight';
}
function pick(slot, used, equip, variant){
  const pool = POOLS[slot].filter(id => allowed(id, equip) && !used.has(id));
  if (!pool.length) return null;
  return pool[variant % pool.length];
}
function buildPlan(p){
  const names = SPLITS[p.days] || SPLITS[3];
  const seen = {};
  const days = names.map(name => {
    const variant = seen[name] = (seen[name] === undefined ? 0 : seen[name] + 1);
    const used = new Set(), ex = [];
    DAYS[name].forEach(slot => {
      const id = pick(slot, used, p.equip, variant);
      if (!id) return;
      used.add(id);
      ex.push(schemeFor(id, p));
    });
    return {name: variant ? name + ' 2' : name, ex};
  });
  return {days};
}
function schemeFor(id, p){
  const comp = LIB[id][3] === 1, g = SCHEME[p.goal] || SCHEME.general, b = comp ? g.c : g.i;
  let s = b.s;
  if (p.exp === 'beginner') s = comp ? Math.min(s, 3) : 2;
  if (p.exp === 'advanced' && comp) s += 1;
  let lo = b.lo, hi = b.hi;
  if (LIB[id][1] === 'Core'){ lo = 12; hi = 20; }
  if (isBW(id) && LIB[id][1] !== 'Core'){ lo = 8; hi = 20; }
  return {id, s, lo, hi, rest: b.rest};
}
function altsFor(id, dayEx, equip){
  const m = muscleOf(id), inDay = new Set(dayEx.map(e => e.id));
  return Object.keys(LIB).filter(k => muscleOf(k) === m && allowed(k, equip) && (k === id || !inDay.has(k)));
}

/* ---------- Numbers about you ---------- */
function calcBody(p){
  const w = p.weightKg, h = p.heightCm, a = p.age;
  const bmi = w / Math.pow(h / 100, 2);
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === 'male' ? 5 : p.sex === 'female' ? -161 : -78);
  const act = {2:1.375, 3:1.45, 4:1.55, 5:1.6, 6:1.7}[p.days] || 1.45;
  const tdee = bmr * act;
  const adj = {muscle:1.1, strength:1.05, fatloss:.8, general:1}[p.goal] || 1;
  const prot = {muscle:1.8, strength:1.8, fatloss:2.0, general:1.6}[p.goal] || 1.6;

function lastPerf(id, list){
  const ss = list || S.sessions;

function bestBefore(id, list){

  list.forEach(s => s.x.forEach(q => { if (q[0] === id) q[1].forEach(st => { const m = metric(id, st[0], st[1]); if (best === null || m > best) best = m; }); }));
  return best;

function suggest(e){
  const last = lastPerf(e.id);
  const L = LIB[e.id];
  if (!last){
    const w = startWeight(e.id, S.profile);
    return {w, r: isBW(e.id) ? e.lo : Math.round((e.lo + e.hi) / 2), note: isBW(e.id) ? 'Bodyweight, add load when it gets easy' : 'Starting estimate from your profile'};
  }

  const topped = last.every(st => st[1] >= e.hi);
  if (topped){

    return {w: w + inc, r: e.lo, note: 'You hit ' + e.hi + ' reps on every set. Go heavier'};
  }

}
function recordSession(st, di, date, mins, xs, opt){
  opt = opt || {};

  xs.forEach(q => {
    const id = q[0], prior = bestBefore(id, st.sessions);
    let top = null;
    q[1].forEach(s => {
      vol += s[0] > 0 ? s[0] * s[1] : (isBW(id) ? st.profile.weightKg * .6 * s[1] : 0);
      const m = metric(id, s[0], s[1]); if (top === null || m > top) top = m;
    });
    if (prior !== null && top > prior * 1.001) prs.push(id);
  });
  const sec = opt.sec != null ? opt.sec : mins * 60;
  const rec = {id: Date.now().toString(36) + st.sessions.length, d: date, n: st.plan.days[di].name, di, m: mins, sec, ok: opt.ok !== false, kc: Math.round(MET * st.profile.weightKg * sec / 3600), t: opt.t || 0, x: xs, v: Math.round(vol), pr: prs};

function niceStep(max, n){
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * mag;

function lineChart(pts, fmt, label){

  const W = 360, H = 170, L = 40, R = 16, T = 22, B = 26;

  const span = (hi - lo) || Math.max(1, hi * .05); lo -= span * .2; hi += span * .2;
  const x = i => L + (W - L - R) * i / (pts.length - 1), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ticks = [lo, (lo + hi) / 2, hi];

  const d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.y).toFixed(1)).join(' ');
  const area = d + ' L' + x(pts.length - 1).toFixed(1) + ' ' + (H - B) + ' L' + x(0).toFixed(1) + ' ' + (H - B) + ' Z';
  let maxI = 0; pts.forEach((p, i) => { if (p.y > pts[maxI].y) maxI = i; });
  const last = pts.length - 1;
  let xl = '<text x="' + x(0) + '" y="' + (H - 6) + '" text-anchor="start">' + esc(pts[0].l) + '</text><text x="' + x(last) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(pts[last].l) + '</text>';
  if (pts.length > 4){ const m = Math.floor(last / 2); xl += '<text x="' + x(m) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(pts[m].l) + '</text>'; }
  const prDot = maxI !== last ? '<circle class="dot pr" cx="' + x(maxI).toFixed(1) + '" cy="' + y(pts[maxI].y).toFixed(1) + '" r="5"/>' : '';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">' + g +
    '<path class="ar" d="' + area + '"/><path class="ln" d="' + d + '"/>' + prDot +

    '<text class="lbl" x="' + Math.min(x(last), W - R) + '" y="' + (y(pts[last].y) - 10).toFixed(1) + '" text-anchor="end">' + fmt(pts[last].y) + '</text>' + xl + '</svg>';
}
function barChart(bars, fmt, label){
  const W = 360, H = 170, L = 8, R = 8, T = 22, B = 26;
  let mx = Math.max.apply(null, bars.map(b => b.v)); if (mx <= 0) mx = 1;
  const step = niceStep(mx, 3), top = Math.ceil(mx / step) * step;
  const slot = (W - L - R) / bars.length, bw = slot * .62;
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = '<line class="axis" x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '"/>', s = '';
  bars.forEach((b, i) => {
    const x = L + slot * i + (slot - bw) / 2, h = Math.max(0, (H - B) - y(b.v));
    const cur = i === bars.length - 1;
    s += '<rect class="bx' + (cur ? '' : ' dim') + '" x="' + x.toFixed(1) + '" y="' + y(b.v).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3"/>';

/* ---------- Calories in vs out ---------- */
function calChart(days, target){
  const W = 360, H = 190, L = 44, R = 8, T = 14, B = 26, n = days.length;
  const mx = Math.max(target, Math.max.apply(null, days.map(d => Math.max(d.in, d.out))));
  const step = niceStep(mx, 4), top = Math.ceil(mx / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top), slot = (W - L - R) / n, bw = Math.max(2, Math.min(14, slot * .38));
  let g = '', s = '';
  for (let v = 0; v <= top + 1; v += step) g += '<line class="axis" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + fmtN(v) + '</text>';
  days.forEach((d, i) => {
    const x0 = L + slot * i + slot / 2;
    if (d.in > 0) s += '<rect class="bx" x="' + (x0 - bw - 1).toFixed(1) + '" y="' + y(d.in).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (y(0) - y(d.in)).toFixed(1) + '" rx="2"/>';
    s += '<rect class="bx out" x="' + (x0 + 1).toFixed(1) + '" y="' + y(d.out).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (y(0) - y(d.out)).toFixed(1) + '" rx="2"/>';
    if ((n - 1 - i) % (n > 14 ? 5 : 1) === 0) s += '<text x="' + x0.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + parseD(d.d).getDate() + '</text>';
  });
  s += '<line class="tgt" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(target).toFixed(1) + '" y2="' + y(target).toFixed(1) + '"/>';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Calories eaten and burned per day">' + g + s + '</svg>';
}
function goalNote(goal, net){
  const R = {muscle: [100, 500, 'a small surplus'], fatloss: [-750, -250, 'a moderate deficit'], strength: [0, 400, 'maintenance to a small surplus'], general: [-200, 200, 'near maintenance']}[goal] || [-200, 200, 'near maintenance'];
  if (net >= R[0] && net <= R[1]) return 'On track for your goal, which suits ' + R[2] + '.';
  return net < R[0] ? 'Below the range that suits your goal (' + R[2] + '). Eating a bit more would move you toward it.' : 'Above the range that suits your goal (' + R[2] + '). Eating a bit less would move you toward it.';
}
function calorieSection(){

  for (let i = n - 1; i >= 0; i--){ const d = addD(t, -i), ft = foodTotals(d); days.push({d, in: ft.k, p: ft.p, logged: ft.n > 0, out: dayBurn(d, base), today: i === 0}); }

/* ---------- Editing sessions ---------- */
const curSess = () => S.sessions.find(x => x.id === ui.editSess);
function calcVol(xs){
  let v = 0;
  xs.forEach(q => q[1].forEach(st => { v += st[0] > 0 ? st[0] * st[1] : (isBW(q[0]) ? S.profile.weightKg * .6 * st[1] : 0); }));
  return Math.round(v);
}
function rebuildPRs(){
  S.sessions.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
  const best = {};
  S.sessions.forEach(s => {
    const prs = [];
    s.x.forEach(q => {
      let top = null;
      q[1].forEach(st => { const m = metric(q[0], st[0], st[1]); if (top === null || m > top) top = m; });
      const prior = best[q[0]];
      if (top !== null && prior !== undefined && top > prior * 1.001) prs.push(q[0]);
      if (top !== null && (prior === undefined || top > prior)) best[q[0]] = top;
    });
    s.pr = prs;
  });
}
function refreshSession(s){
  if (s.sec == null) s.sec = sessSec(s);
  s.m = Math.max(1, Math.round(s.sec / 60));
  s.kc = Math.round(MET * S.profile.weightKg * s.sec / 3600);
  s.v = calcVol(s.x);
  rebuildPRs();
  save();
}
function cleanupSession(s){
  s.x = s.x.map(q => [q[0], q[1].filter(st => st[1] > 0)]).filter(q => q[1].length);
  if (!s.x.length) s.ok = false;
}
function leaveEdit(){
  if (ui.editSess){
    const s = curSess();
    if (s){ cleanupSession(s); refreshSession(s); }
    ui.editSess = null;
  }
  ui.confirm = null;
}
function addPastWorkout(date, di, mins, ok){
  const day = S.plan.days[di];
  const xs = day.ex.map(e => { const sg = suggest(e); return [e.id, Array.from({length: e.s}, () => [Math.round(sg.w * 100) / 100, sg.r])]; });
  const rec = {id: 'm' + Date.now().toString(36) + Math.floor(Math.random() * 1e4), d: date, n: day.name, di, m: mins, sec: mins * 60, ok, kc: 0, t: 0, x: xs, v: 0, pr: []};
  S.sessions.push(rec);
  if (ok && di === S.next % S.plan.days.length) S.next = (di + 1) % S.plan.days.length;
  refreshSession(rec);
  return rec;
}

function quickTotals(){

function hideRest(){ ui.rest.until = 0; document.getElementById('restHost').innerHTML = ''; }
function tick(){
  const el = document.getElementById('elapsed');
  if (el && S.active && !S.active.tStop) el.textContent = fmtMin((Date.now() - S.active.t0) / 1000);
  if (!ui.rest.until) return;
  const left = Math.ceil((ui.rest.until - Date.now()) / 1000), c = document.getElementById('restClock');
  if (c) c.textContent = left > 0 ? fmtMin(left) : 'Go';
  if (left <= 0 && !ui.rest.buzzed){ ui.rest.buzzed = true; try { navigator.vibrate && navigator.vibrate(200); } catch(e){} }

/* ---------- Actions ---------- */
function startWorkout(di){
  if (di === undefined || isNaN(di)) di = S.next % S.plan.days.length;
  const day = S.plan.days[di];
  S.active = {di, t0: Date.now(), x: day.ex.map(e => {
    const sg = suggest(e);
    return {id: e.id, s: e.s, lo: e.lo, hi: e.hi, rest: e.rest, sets: Array.from({length: e.s}, () => ({w: sg.w, r: sg.r, done: false}))};
  })};
  ui.workout = true; ui.day = null; ui.summary = null; save(); render(); window.scrollTo(0, 0);
}
function finishWorkout(ok){
  const a = S.active, end = a.tStop || Date.now(), sec = Math.max(1, Math.round((end - a.t0) / 1000));
  const xs = a.x.map(x => [x.id, x.sets.filter(s => s.done && s.r > 0).map(s => [Math.round(s.w * 100) / 100, s.r])]).filter(q => q[1].length);
  if (xs.length || sec >= 60){
    const rec = recordSession(S, a.di, ds(new Date(a.t0)), Math.max(1, Math.round(sec / 60)), xs, {sec, ok: ok && xs.length > 0, t: a.t0});
    ui.summary = {session: rec};
    if (rec.ok) S.next = (a.di + 1) % S.plan.days.length;
  }
  S.active = null; ui.workout = false; ui.tab = 'today'; ui.confirm = null; hideRest(); save(); render(); window.scrollTo(0, 0);
}
function readDraft(){
  const d = ui.draft, lb = d.units === 'lb';
  const age = parseInt(d.age, 10), h = parseFloat(String(d.h).replace(',', '.')), w = parseFloat(String(d.w).replace(',', '.'));
  const hc = lb ? h * 2.54 : h, wk = lb ? w / LB : w;
  if (!(age >= 14 && age <= 90)) return {err: 'Enter an age between 14 and 90.'};
  if (!(hc >= 120 && hc <= 230)) return {err: lb ? 'Enter a height between 48 and 90 inches.' : 'Enter a height between 120 and 230 cm.'};
  if (!(wk >= 30 && wk <= 250)) return {err: lb ? 'Enter a weight between 66 and 551 lb.' : 'Enter a weight between 30 and 250 kg.'};
  return {p: {name: d.name.trim().slice(0, 24), age, sex: d.sex, heightCm: Math.round(hc * 10) / 10, weightKg: Math.round(wk * 10) / 10, goal: d.goal, exp: d.exp, days: parseInt(d.days, 10), equip: d.equip, units: d.units}};
}
function logBody(kg){ setBody(todayS(), kg); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const a = b.dataset.act, D = b.dataset;
  const keep = a !== 'discard' && a !== 'reset' && a !== 'rebuild' && a !== 'delfood' && a !== 'sedel';
  if (keep && ui.confirm) ui.confirm = null;
  if (a === 'tab'){ leaveEdit(); ui.day = null; ui.addW = false; ui.editFood = null; ui.tab = D.v; ui.workout = false; ui.editing = false; ui.draft = null; ui.err = null; render(); window.scrollTo(0, 0); }
  else if (a === 'seg'){
    const d = ui.draft;
    if (D.k === 'units' && d.units !== D.v){
      const toLb = D.v === 'lb', h = parseFloat(d.h), w = parseFloat(d.w);
      if (h) d.h = String(Math.round(toLb ? h / 2.54 : h * 2.54));
      if (w) d.w = String(Math.round((toLb ? w * LB : w / LB) * 10) / 10);
    }
    d[D.k] = D.v; keepScroll();
  }
  else if (a === 'saveprofile'){
    const r = readDraft();
    if (r.err){ ui.err = r.err; keepScroll(); return; }
    ui.err = null;
    const old = S.profile, p = r.p;
    if (old){
      const changed = old.goal !== p.goal || old.exp !== p.exp || old.days !== p.days || old.equip !== p.equip;
      if (Math.abs(old.weightKg - p.weightKg) > .04){ S.profile = p; logBody(p.weightKg); }
      S.profile = p;
      if (changed){ S.plan = buildPlan(p); S.next = 0; }
    } else {
      S = blank(); S.profile = p; S.plan = buildPlan(p); S.body = [{d: todayS(), kg: p.weightKg}];
    }
    ui.editing = false; ui.draft = null; ui.tab = old ? 'me' : 'today'; save(); render(); window.scrollTo(0, 0);
  }
  else if (a === 'editprofile'){ ui.editing = true; ui.draft = draftFrom(S.profile); render(); window.scrollTo(0, 0); }
  else if (a === 'cancelprofile'){ ui.editing = false; ui.draft = null; ui.err = null; render(); }
  else if (a === 'demo'){ S = makeDemo(); ui.day = null; ui.editSess = null; ui.draft = null; ui.tab = 'today'; save(); render(); window.scrollTo(0, 0); }
  else if (a === 'cleardemo'){ S = blank(); ui.day = null; ui.editSess = null; ui.draft = null; ui.tab = 'today'; ui.summary = null; hideRest(); save(); render(); window.scrollTo(0, 0); }
  else if (a === 'reset'){
    if (ui.confirm !== 'reset'){ ui.confirm = 'reset'; render(); return; }
    S = blank(); ui.day = null; ui.editSess = null; ui.confirm = null; ui.draft = null; ui.tab = 'today'; ui.summary = null; hideRest(); save(); render(); window.scrollTo(0, 0);
  }
  else if (a === 'start') startWorkout(D.di === undefined ? undefined : +D.di);
  else if (a === 'resume'){ ui.day = null; ui.workout = true; render(); window.scrollTo(0, 0); }
  else if (a === 'stop'){ S.active.tStop = Date.now(); hideRest(); save(); render(); window.scrollTo(0, 0); }
  else if (a === 'stopdone') finishWorkout(true);
  else if (a === 'stopnot') finishWorkout(false);
  else if (a === 'stopcancel'){ S.active.t0 += Date.now() - S.active.tStop; delete S.active.tStop; save(); render(); }
  else if (a === 'discard'){
    if (ui.confirm !== 'discard'){ ui.confirm = 'discard'; keepScroll(); return; }
    S.active = null; ui.workout = false; ui.confirm = null; hideRest(); save(); render(); window.scrollTo(0, 0);
  }
  else if (a === 'check'){
    const x = S.active.x[+D.xi], s = x.sets[+D.si];
    if (!s.done && !(s.r > 0)){ const f = document.getElementById('r-' + D.xi + '-' + D.si); if (f) f.focus(); return; }
    s.done = !s.done; if (s.done && !S.active.tStop) startRest(x.rest); save(); keepScroll();
  }
  else if (a === 'addset'){ const x = S.active.x[+D.xi], l = x.sets[x.sets.length - 1]; x.sets.push({w: l.w, r: l.r, done: false}); save(); keepScroll(); }
  else if (a === 'rmset'){ const x = S.active.x[+D.xi]; if (x.sets.length > 1){ x.sets.pop(); save(); keepScroll(); } }
  else if (a === 'rest30'){ ui.rest.until += 30000; ui.rest.buzzed = false; tick(); }
  else if (a === 'restskip') hideRest();
  else if (a === 'swap'){
    const day = S.plan.days[+D.d], e = day.ex[+D.e], alts = altsFor(e.id, day.ex, S.profile.equip);
    const nx = alts[(alts.indexOf(e.id) + 1) % alts.length];
    if (nx && nx !== e.id){ day.ex[+D.e] = schemeFor(nx, S.profile); save(); keepScroll(); }
  }
  else if (a === 'rebuild'){
    if (ui.confirm !== 'rebuild'){ ui.confirm = 'rebuild'; keepScroll(); return; }
    S.plan = buildPlan(S.profile); S.next = 0; ui.confirm = null; save(); render(); window.scrollTo(0, 0);
  }
  else if (a === 'logbody'){
    const el = document.getElementById('bw'), v = parseFloat(String(el.value).replace(',', '.')), kg = fromDisp(v);
    if (!(kg >= 30 && kg <= 250)){ el.focus(); return; }
    logBody(Math.round(kg * 10) / 10); save(); keepScroll();
  }
  else if (a === 'how'){ ui.how = ui.how || {}; ui.how[D.id] = !ui.how[D.id]; keepScroll(); }
  else if (a === 'foodtab'){ ui.foodTab = D.v; ui.foodEdit = null; render(); window.scrollTo(0, 0); }
  else if (a === 'meal'){ ui.meal = D.v; keepScroll(); }
  else if (a === 'logfood'){
    const f = S.foods.find(x => x.id === D.id); if (!f) return;
    logFood(f, parseFloat(document.getElementById('q-' + D.id).value) || 1, D.d || todayS()); keepScroll();
  }
  else if (a === 'addfood'){
    const n = document.getElementById('fd-n').value.trim().slice(0, 40) || 'Food', k = parseFloat(document.getElementById('fd-k').value), p = parseFloat(document.getElementById('fd-p').value) || 0;
    if (!(k > 0 && k <= 5000)){ document.getElementById('fd-k').focus(); return; }
    logEntry({n, s: '', k: Math.round(k), p: Math.round(Math.min(p, 500)), c: 0, f: 0, m: ui.meal || defaultMeal()}, D.d || todayS()); keepScroll();
  }
  else if (a === 'rmfood'){ const dd = D.d || todayS(), l = S.food[dd]; if (l){ l.splice(+D.i, 1); if (!l.length) delete S.food[dd]; } ui.editFood = null; save(); keepScroll(); }
  else if (a === 'newfood'){ ui.foodTab = 'foods'; ui.foodEdit = 'new'; render(); window.scrollTo(0, 0); }
  else if (a === 'editfood'){ ui.foodEdit = D.id; render(); window.scrollTo(0, 0); }
  else if (a === 'cancelfood'){ ui.foodEdit = null; ui.confirm = null; render(); }
  else if (a === 'savefood'){ if (saveFoodForm()){ ui.foodEdit = null; save(); render(); window.scrollTo(0, 0); } }
  else if (a === 'delfood'){
    if (ui.confirm !== 'delfood'){ ui.confirm = 'delfood'; keepScroll(); return; }
    S.foods = S.foods.filter(x => x.id !== ui.foodEdit); ui.foodEdit = null; ui.confirm = null; save(); render(); window.scrollTo(0, 0);
  }
  else if (a === 'calrange'){ ui.calRange = +D.v; keepScroll(); }
  else if (a === 'day'){ if (validDay(D.d)){ leaveEdit(); ui.day = D.d; ui.addW = false; ui.editFood = null; render(); window.scrollTo(0, 0); } }
  else if (a === 'dayback'){ leaveEdit(); ui.day = null; ui.addW = false; ui.editFood = null; render(); window.scrollTo(0, 0); }
  else if (a === 'dayprev' || a === 'daynext'){ const n = addD(ui.day, a === 'dayprev' ? -1 : 1); if (validDay(n)){ ui.day = n; ui.addW = false; ui.editFood = null; render(); window.scrollTo(0, 0); } }
  else if (a === 'logrange'){ ui.logN = +D.v; keepScroll(); }
  else if (a === 'qx'){ ui.qx = D.v; keepScroll(); }
  else if (a === 'qadd'){
    const key = ui.qx || 'pushup', el = document.getElementById('qa-n'), v = Math.round(parseFloat(String(el.value).replace(',', '.')));
    let name = QX[key][0];
    if (key === 'custom'){ name = document.getElementById('qa-name').value.trim().slice(0, 24); if (!name){ document.getElementById('qa-name').focus(); return; } }
    if (!(v > 0 && v <= 5000)){ el.focus(); return; }
    addQuick(D.d, key, name, v); keepScroll();
  }
  else if (a === 'qrm'){ const l = S.quick[D.d]; if (l){ l.splice(+D.i, 1); if (!l.length) delete S.quick[D.d]; save(); keepScroll(); } }
  else if (a === 'addw'){ ui.addW = !ui.addW; keepScroll(); }
  else if (a === 'awcancel'){ ui.addW = false; keepScroll(); }
  else if (a === 'awsave'){
    const di = +document.getElementById('aw-di').value, m = Math.round(parseFloat(document.getElementById('aw-m').value)), ok = document.getElementById('aw-ok').value === '1';
    if (!(m >= 1 && m <= 600)){ document.getElementById('aw-m').focus(); return; }
    const rec = addPastWorkout(D.d, di, m, ok); ui.addW = false; ui.editSess = rec.id; render(); window.scrollTo(0, 0);
  }
  else if (a === 'editsess'){ ui.editSess = D.id; ui.confirm = null; render(); window.scrollTo(0, 0); }
  else if (a === 'seback' || a === 'sedone'){ leaveEdit(); render(); window.scrollTo(0, 0); }
  else if (a === 'sedel'){
    if (ui.confirm !== 'sedel'){ ui.confirm = 'sedel'; keepScroll(); return; }
    S.sessions = S.sessions.filter(x => x.id !== ui.editSess); ui.editSess = null; ui.confirm = null; rebuildPRs(); save(); render(); window.scrollTo(0, 0);
  }
  else if (a === 'seok'){ const s = curSess(); s.ok = D.v === '1'; save(); keepScroll(); }
  else if (a === 'seaddset'){ const s = curSess(), q = s.x[+D.xi], l = q[1][q[1].length - 1] || [0, 10]; q[1].push([l[0], l[1]]); refreshSession(s); keepScroll(); }
  else if (a === 'sesetrm'){ const s = curSess(); s.x[+D.xi][1].splice(+D.si, 1); refreshSession(s); keepScroll(); }
  else if (a === 'serm'){ const s = curSess(); s.x.splice(+D.xi, 1); refreshSession(s); keepScroll(); }
  else if (a === 'seaddex'){
    const s = curSess(), id = document.getElementById('se-addex').value; if (!LIB[id]) return;
    const lp = lastPerf(id); s.x.push([id, [lp ? [lp[0][0], lp[0][1]] : [startWeight(id, S.profile), 10]]]); refreshSession(s); keepScroll();
  }
  else if (a === 'daybody'){
    const el = document.getElementById('dbw'), kg = fromDisp(parseFloat(String(el.value).replace(',', '.')));
    if (!(kg >= 30 && kg <= 250)){ el.focus(); return; }
    setBody(D.d, Math.round(kg * 10) / 10); save(); keepScroll();
  }
  else if (a === 'daybodyrm'){ S.body = S.body.filter(b => b.d !== D.d); if (S.body.length) S.profile.weightKg = S.body[S.body.length - 1].kg; save(); keepScroll(); }
  else if (a === 'editfe'){ ui.editFood = {d: D.d, i: +D.i}; keepScroll(); }
  else if (a === 'cancelfe'){ ui.editFood = null; keepScroll(); }
  else if (a === 'savefe'){ if (saveFoodEntry()){ ui.editFood = null; save(); keepScroll(); } }
  else if (a === 'install'){ if (deferredInstall){ const ev = deferredInstall; ev.prompt(); Promise.resolve(ev.userChoice).then(() => { deferredInstall = null; render(); }, () => {}); } }
  else if (a === 'closesummary'){ ui.summary = null; render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'fq'){ ui.foodQ = t.value; const q = t.value.trim().toLowerCase(); document.querySelectorAll('.fopt').forEach(r => { r.hidden = !!q && r.dataset.name.indexOf(q) < 0; }); return; }
  if (t.dataset.se !== undefined){
    const s = curSess(), x = s && s.x[+t.dataset.xi], st = x && x[1][+t.dataset.si], v = parseFloat(String(t.value).replace(',', '.'));
    if (st){ if (t.dataset.se === 'w') st[0] = isNaN(v) ? 0 : fromDisp(Math.max(0, v)); else st[1] = isNaN(v) ? 0 : Math.max(0, Math.round(v)); refreshSession(s); }
    return;
  }
  if (t.id === 'se-m'){ const s = curSess(), v = parseFloat(String(t.value).replace(',', '.')); if (s && v >= 1 && v <= 1000){ s.sec = Math.round(v * 60); refreshSession(s); } return; }
  if (t.dataset.f && S.active){
    const s = S.active.x[+t.dataset.xi].sets[+t.dataset.si], v = parseFloat(String(t.value).replace(',', '.'));
    if (t.dataset.f === 'w') s.w = isNaN(v) ? 0 : fromDisp(Math.max(0, v));
    else s.r = isNaN(v) ? 0 : Math.max(0, Math.round(v));
    save();
  } else if (t.dataset.k && ui.draft){ ui.draft[t.dataset.k] = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'exsel'){ ui.chartEx = t.value; keepScroll(); }
  else if (t.id === 'daypick' || t.id === 'logpick'){ if (validDay(t.value)){ leaveEdit(); ui.day = t.value; ui.addW = false; ui.editFood = null; render(); window.scrollTo(0, 0); } }
  else if (t.id === 'se-d'){ const s = curSess(); if (s && validDay(t.value)){ s.d = t.value; ui.day = t.value; refreshSession(s); } }
  else if (t.id === 'se-di'){ const s = curSess(), i = +t.value; if (s && i >= 0 && S.plan.days[i]){ s.di = i; s.n = S.plan.days[i].name; save(); } }
  else if (t.dataset.qe !== undefined){
    const l = S.quick[t.dataset.d], en = l && l[+t.dataset.qe], v = Math.round(parseFloat(String(t.value).replace(',', '.')));
    if (en && v > 0 && v <= 5000){ const n = qEntry(en.k, en.n, v, S.profile.weightKg); en.a = n.a; en.kc = n.kc; save(); }
    keepScroll();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'qa-n' || e.target.id === 'qa-name')){ const b = document.querySelector('[data-act="qadd"]'); if (b) b.click(); }
});

/* ---------- Boot ---------- */
(function boot(){
  const l = loadLocal(); if (l) S = l;
  render();
  connectDb();
})();


</script>

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
